version: 2

models:
  - name: stg_aire_horario
    description: >
      El CSV horario de BA Data (data/raw/calidad-aire.csv) tipado y en formato largo.
      Una fila por celda del CSV: fecha × hora × estación × contaminante (sin Palermo, desactivada
      desde 2010). No se borra nada.
    columns:
      - name: fecha
        description: Fecha del dato (DATE).
        data_tests: [not_null]
      - name: hora
        description: Hora que termina (1 = de 00:00 a 01:00 … 24 = de 23:00 a 24:00). La fuente trae algunas fuera de 1-24.
      - name: id_estacion
        description: Código de la estación en snake_case ('centenario', 'cordoba', 'la_boca').
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["centenario", "cordoba", "la_boca"]
      - name: id_contaminante
        description: Código del contaminante ('no2', 'pm10', 'co').
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["no2", "pm10", "co"]
      - name: valor_crudo
        description: Texto original de la celda (vacía = nulo).
      - name: estado_valor
        description: Clasificación del crudo.
        data_tests:
          - accepted_values:
              arguments:
                values: ["valido", "sin_dato", "bajo_limite_deteccion", "invalido"]
      - name: limite_deteccion
        description: Límite de detección informado ('<0.05' -> 0,05). Solo para valores bajo el límite.
      - name: valor
        description: Valor numérico en la unidad original (ppb, ppm o µg/m³); imputado como límite / 2 si era '<x'.
      - name: es_imputado
        description: Verdadero si el valor era '<límite' y se imputó como límite / 2.
    data_tests:
      - clave_unica:
          arguments:
            columnas: [fecha, hora, id_estacion, id_contaminante]

  - name: stg_aire_horario_validado
    description: >
      stg_aire_horario con las reglas de validación como columnas booleanas y el motivo por el que
      un valor no se usa. Mismo grano y mismas filas que stg_aire_horario.
    columns:
      - name: hora_invalida
        description: La hora no está entre 1 y 24.
      - name: fuera_de_rango
        description: Valor negativo o mayor al máximo plausible del contaminante.
      - name: fila_en_cero
        description: Todas las mediciones de esa fecha y hora valen 0 (planilla vacía cargada con ceros).
      - name: valor_trabado
        description: NO2 idéntico durante horas_valor_trabado horas seguidas o más.
      - name: horas_iguales_seguidas
        description: Largo de la racha de valores iguales de NO2 a la que pertenece la hora.
      - name: motivo_invalido
        description: Primer motivo que aplica (hora_invalida, sin_dato_fuente, texto_invalido, fuera_de_rango, fila_en_cero, valor_trabado). Vacío = válido.
        data_tests:
          - accepted_values:
              arguments:
                values: ["hora_invalida", "sin_dato_fuente", "texto_invalido", "fuera_de_rango", "fila_en_cero", "valor_trabado"]
      - name: es_valido
        description: Verdadero si el valor pasa todas las reglas y se usa en el análisis.
        data_tests: [not_null]

  - name: stg_aire_diario
    description: >
      Valor diario (promedio de 24 h) por fecha × estación × contaminante, para toda la serie y
      solo los días presentes en la fuente. NO2: promedio de las horas válidas con al menos 18;
      PM10: promedio móvil de la hora 24; CO: promedio de los bloques de 8 h (horas 8, 16 y 24).
    columns:
      - name: promedio_fuente
        description: Cómo publica la red el contaminante (horario, movil_8h, movil_24h).
      - name: n_horas_fila
        description: Horas (1 a 24) que la fuente tiene para ese día.
      - name: n_horas_validas
        description: Horas con valor válido.
      - name: n_horas_sin_dato
        description: Horas con 's/d' o vacías.
      - name: valor_diario
        description: Promedio de 24 h en la unidad original. Nulo si no alcanza la información del día.
      - name: maximo_horario
        description: Máximo horario del día (solo NO2).
      - name: tiene_dato
        description: Verdadero si hay valor diario.
      - name: motivo_sin_dato
        description: "'sin_dato_fuente' (todas las horas en s/d) o 'incompleto'. Vacío si tiene_dato."
      - name: es_imputado
        description: Verdadero si el valor diario usa alguna hora imputada ('<límite').
    data_tests:
      - clave_unica:
          arguments:
            columnas: [fecha, id_estacion, id_contaminante]
