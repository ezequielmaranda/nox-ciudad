version: 2

models:
  - name: stg_aire
    description: >
      El CSV crudo de la extracción (data/raw/aire_publico.csv) tipado y normalizado.
      Una fila por celda de los PDF: estación × fecha × contaminante × estadístico. No se borra nada.
    columns:
      - name: id_estacion
        description: Código de la estación en snake_case ('centenario', 'cordoba', 'la_boca').
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["centenario", "cordoba", "la_boca"]
      - name: fecha
        description: Fecha del dato (DATE). Nula si el texto no fuera una fecha válida.
        data_tests: [not_null]
      - name: id_contaminante
        description: Código del contaminante ('no', 'no2', 'nox', 'co', 'pm10').
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["no", "no2", "nox", "co", "pm10"]
      - name: estadistico
        description: >
          Qué valor del día es: '24h' (promedio diario), '0-8', '8-16', '16-24' (promedios por
          bloque de 8 horas), 'max_1h' y 'min_1h' (máximo y mínimo horario).
        data_tests:
          - accepted_values:
              arguments:
                values: ["24h", "0-8", "8-16", "16-24", "max_1h", "min_1h"]
      - name: valor_crudo
        description: Texto tal como figura en el PDF (coma decimal, 's/d', '<4', etc.).
      - name: estado_valor
        description: Clasificación del texto crudo.
        data_tests:
          - accepted_values:
              arguments:
                values: ["valido", "sin_dato", "bajo_limite_deteccion", "invalido"]
      - name: limite_deteccion
        description: Límite de detección informado (solo cuando el crudo es '<x').
      - name: valor
        description: Valor numérico en la unidad original. Para '<x' se imputa x/2.
      - name: es_imputado
        description: Verdadero si el valor se imputó como límite de detección / 2.
      - name: unidad
        description: Unidad original ('ppb', 'ppm' o 'ug/m3').
      - name: archivo_pdf
        description: Nombre del PDF de origen (trazabilidad).
    data_tests:
      - clave_unica:
          arguments:
            columnas: [id_estacion, fecha, id_contaminante, estadistico]

  - name: stg_aire_validado
    description: >
      stg_aire más las reglas de validación física (una columna booleana por regla),
      el motivo por el que un valor no se usa y es_valido. Ver el encabezado del SQL.
    columns:
      - name: es_promedio
        description: Verdadero para los promedios (24h y bloques); falso para máximo y mínimo horario.
      - name: fuera_de_rango
        description: Valor negativo o mayor al máximo físico del contaminante.
      - name: valor_trabado
        description: Los 6 estadísticos del día son idénticos (analizador sin variación en 24 h).
      - name: cero_sin_respaldo
        description: Promedio en 0 con máximo horario 0 o faltante.
      - name: fuera_de_max_min
        description: Promedio fuera del rango [mínimo horario, máximo horario] ± tolerancia.
      - name: promedio_incoherente
        description: El promedio de 24 h difiere del promedio de los 3 bloques en más que la tolerancia.
      - name: no_mayor_que_nox
        description: NO > NOx en el mismo día y estadístico.
      - name: no2_mayor_que_nox
        description: NO2 > NOx en el mismo día y estadístico.
      - name: nox_incoherente
        description: "|NOx − (NO + NO2)| > 2 ppb en el mismo día y estadístico."
      - name: motivo_invalido
        description: Primer motivo por el que el valor no se usa (nulo = válido).
        data_tests:
          - accepted_values:
              arguments:
                values: ["sin_dato_fuente", "texto_invalido", "fuera_de_rango", "valor_trabado",
                         "cero_sin_respaldo", "fuera_de_max_min", "promedio_incoherente",
                         "mayor_que_nox", "nox_incoherente"]
      - name: es_valido
        description: Verdadero si el valor pasa todas las reglas y se usa en el análisis.
        data_tests: [not_null]

  - name: stg_manifiesto
    description: Manifiesto de la extracción tipado. Un registro por PDF enlazado desde las páginas de la APrA.
    columns:
      - name: estado
        description: Estado resumido del archivo.
        data_tests:
          - accepted_values:
              arguments:
                values: ["ok", "ok_con_aviso", "descartado", "error", "fuera_del_periodo"]
