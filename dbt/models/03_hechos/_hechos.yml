version: 2

models:
  - name: fact_medicion_diaria
    description: >
      Tabla de hechos en formato largo. Grano: fecha × estación × contaminante, con el promedio de
      24 h. Grilla completa: incluye los días sin dato, marcados con tiene_dato = falso y el motivo
      en motivo_sin_dato.
    columns:
      - name: fecha
        description: Fecha (clave hacia dim_calendario).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_calendario')
                field: fecha
      - name: id_estacion
        description: Estación (clave hacia dim_estacion).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_estacion')
                field: id_estacion
      - name: id_contaminante
        description: Contaminante (clave hacia dim_contaminante).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_contaminante')
                field: id_contaminante
      - name: n_horas_validas
        description: Horas con valor válido ese día (0 a 24). Para el NO2 hacen falta 18 para el promedio diario.
        data_tests:
          - entre:
              arguments:
                minimo: 0
                maximo: 24
      - name: tiene_fila
        description: Verdadero si la fuente tiene al menos una hora de ese día.
      - name: tiene_dato
        description: Verdadero si hay promedio de 24 h válido.
        data_tests: [not_null]
      - name: motivo_sin_dato
        description: "Por qué no hay dato (vacío si tiene_dato): 'sin_fila', 'sin_dato_fuente' o 'incompleto'."
        data_tests:
          - accepted_values:
              arguments:
                values: ["sin_fila", "sin_dato_fuente", "incompleto"]
      - name: valor
        description: Promedio de 24 h en la unidad original (solo si tiene_dato).
        data_tests:
          - entre:
              arguments:
                minimo: 0
                maximo: 1000
      - name: unidad
        description: Unidad original (ppb, ppm, µg/m³).
      - name: valor_masa
        description: Promedio de 24 h en la unidad de la guía OMS (µg/m³; mg/m³ para CO). Solo si tiene_dato.
        data_tests:
          - entre:
              arguments:
                minimo: 0
                maximo: 2000
      - name: unidad_masa
        description: Unidad de valor_masa.
      - name: es_imputado
        description: Verdadero si el valor usa alguna hora '<límite' imputada como límite / 2.
      - name: es_outlier
        description: Verdadero si valor > Q3 + 3·IQR de su estación × contaminante. Se marca, no se borra.
        data_tests: [not_null]
      - name: umbral_outlier
        description: Umbral Q3 + 3·IQR de esa estación × contaminante.
    data_tests:
      - clave_unica:
          arguments:
            columnas: [fecha, id_estacion, id_contaminante]

  - name: fact_medicion_horaria
    description: >
      Valores horarios de NO2 del período de estudio (el único contaminante publicado como
      promedio de cada hora). Grano: fecha × hora × estación. Comparte dimensiones con la fact
      diaria; sirve para el perfil horario por tipo de día.
    columns:
      - name: fecha
        description: Fecha (clave hacia dim_calendario).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_calendario')
                field: fecha
      - name: hora
        description: Hora que termina (1 a 24; la 8 es de 07:00 a 08:00).
        data_tests:
          - not_null
          - entre:
              arguments:
                minimo: 1
                maximo: 24
      - name: id_estacion
        description: Estación (clave hacia dim_estacion).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_estacion')
                field: id_estacion
      - name: id_contaminante
        description: Siempre 'no2' (clave hacia dim_contaminante).
        data_tests:
          - accepted_values:
              arguments:
                values: ["no2"]
      - name: es_valido
        description: Verdadero si el valor horario pasa las reglas de calidad.
      - name: motivo_invalido
        description: Motivo por el que la hora no se usa (vacío si es válida).
      - name: valor
        description: NO2 horario en ppb (solo si es válido).
      - name: unidad
        description: ppb.
      - name: valor_masa
        description: NO2 horario en µg/m³ (solo si es válido).
      - name: unidad_masa
        description: µg/m³.
    data_tests:
      - clave_unica:
          arguments:
            columnas: [fecha, hora, id_estacion]
