version: 2

models:
  - name: agg_cumplimiento_diario
    description: >
      Cumplimiento diario de la guía OMS de 24 h. Grano: fecha × estación × contaminante, solo días
      con dato válido y contaminantes con guía de 24 h (NO2, PM10, CO).
    columns:
      - name: fecha
        description: Fecha.
        data_tests: [not_null]
      - name: id_estacion
        description: Estación.
        data_tests: [not_null]
      - name: id_contaminante
        description: Contaminante.
        data_tests:
          - accepted_values:
              arguments:
                values: ["no2", "pm10", "co"]
      - name: valor
        description: Promedio de 24 h en la unidad de la guía (µg/m³; mg/m³ para CO).
        data_tests: [not_null]
      - name: unidad
        description: Unidad.
      - name: guia_oms_24h
        description: Guía OMS de 24 h del contaminante.
      - name: supera_guia
        description: Verdadero si valor > guía.
      - name: veces_guia
        description: valor / guía (1 = justo en la guía).
      - name: nivel_oms
        description: Escalón OMS del día (AQG, IT4 … IT1, '> IT1').
        data_tests:
          - accepted_values:
              arguments:
                values: ["AQG", "IT4", "IT3", "IT2", "IT1", "> IT1"]
      - name: es_outlier
        description: Marca de valor atípico heredada de la fact.
    data_tests:
      - clave_unica:
          arguments:
            columnas: [fecha, id_estacion, id_contaminante]

  - name: agg_anual
    description: >
      Indicadores anuales por estación × contaminante × período (2024, 2025, 2026 parcial y
      últimos 12 meses), con la regla del 75% aplicada.
    columns:
      - name: id_estacion
        description: Estación.
      - name: id_contaminante
        description: Contaminante (NO2, PM10, CO).
      - name: id_periodo
        description: Período (clave hacia dim_periodo).
      - name: periodo
        description: Etiqueta del período.
      - name: tipo_periodo
        description: anio_completo, anio_parcial o movil_12m.
      - name: anio
        description: Año (vacío para movil_12m).
      - name: n_dias_periodo
        description: Días del período.
      - name: n_dias_con_dato
        description: Días con dato válido de 24 h.
      - name: completitud
        description: n_dias_con_dato / n_dias_periodo.
      - name: es_valido
        description: Verdadero si completitud >= 75%.
      - name: estado_indicador
        description: "'valido' o 'no_valido'."
      - name: unidad
        description: Unidad de la guía.
      - name: promedio_anual
        description: Promedio de los valores diarios (vacío si no es válido).
      - name: promedio_referencial
        description: El mismo promedio calculado aunque no sea válido. Solo para transparencia.
      - name: guia_anual
        description: Guía anual OMS (vacía para CO, que no tiene).
      - name: veces_guia_anual
        description: promedio_anual / guia_anual.
      - name: nivel_oms
        description: Escalón OMS del promedio anual (AQG, IT4 … IT1, '> IT1').
      - name: proximo_nivel
        description: Escalón al que se llega bajando ug_para_proximo_nivel.
      - name: ug_para_proximo_nivel
        description: Cuánto tendría que bajar el promedio anual para subir un escalón.
      - name: p99_24h
        description: Percentil 99 de los valores diarios (definición formal de la guía de 24 h). Vacío si no es válido.
      - name: guia_24h
        description: Guía OMS de 24 h.
      - name: p99_veces_guia_24h
        description: p99_24h / guia_24h.
      - name: p99_supera_guia_24h
        description: Verdadero si el P99 supera la guía de 24 h (no se cumple la guía en sentido formal).
      - name: maximo_diario
        description: Máximo valor diario del período.
      - name: n_dias_supera_24h
        description: Días por encima de la guía de 24 h.
      - name: pct_dias_supera_24h
        description: n_dias_supera_24h / n_dias_con_dato (0 a 1).
    data_tests:
      - clave_unica:
          arguments:
            columnas: [id_estacion, id_contaminante, id_periodo]

  - name: agg_rachas
    description: Rachas de días consecutivos sobre la guía de 24 h (gaps and islands). Un día sin dato corta la racha.
    columns:
      - name: id_estacion
        description: Estación.
      - name: id_contaminante
        description: Contaminante.
      - name: fecha_inicio
        description: Primer día de la racha.
      - name: fecha_fin
        description: Último día de la racha.
      - name: dias
        description: Duración de la racha en días.
      - name: es_racha_maxima
        description: Verdadero si es la racha más larga de su estación × contaminante.
