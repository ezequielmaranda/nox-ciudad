version: 2

models:
  - name: silver_sube
    description: >
      SUBE tipado (grano: fecha × empresa × etiqueta de línea × modo). Agrega `linea_num` (número de
      línea normalizado), `es_colectivo_caba` (universo de análisis: 134 líneas que circulan por CABA)
      y `es_linea_solo_caba` (las 31 líneas traspasadas a la Ciudad en enero de 2025).
    columns:
      - name: fecha
        data_tests: [not_null]
      - name: usos
        description: Transacciones SUBE (validaciones) del día.
      - name: tipo_transporte
        data_tests:
          - accepted_values:
              arguments:
                values: ["COLECTIVO", "TREN", "SUBTE", "LANCHAS"]

  - name: silver_colectivos_caba_linea_dia
    description: Usos por línea (número normalizado) y día, sumando etiquetas y operadores de la misma línea.

  - name: silver_sube_actividad_diaria
    description: >
      Actividad diaria por modo en el AMBA, como proporción de un día típico (mediana del mismo día de
      la semana, ±4 semanas). Define `es_dia_normal`: hábil, no feriado y colectivo, tren y subte > 90%.
    columns:
      - name: fecha
        data_tests: [unique, not_null]
      - name: es_dia_normal
        data_tests: [not_null]
