version: 2

models:
  - name: dim_estacion
    description: Una fila por estación de monitoreo de la APrA.
    columns:
      - name: id_estacion
        description: Clave de la estación ('centenario', 'cordoba', 'la_boca').
        data_tests: [unique, not_null]
      - name: codigo_fuente
        description: Nombre de la estación como figura en la fuente ('LA BOCA').
      - name: nombre
        description: Nombre legible para mostrar.
      - name: direccion
        description: Ubicación de la cabina según la APrA.
      - name: entorno
        description: Tipo de zona según la APrA (residencial-comercial, mixta).
      - name: flujo_vehicular
        description: Flujo vehicular de la zona según la APrA (alto, medio, medio-bajo).
      - name: fuentes_fijas
        description: Incidencia de fuentes fijas (industrias, puerto) según la APrA.
      - name: inicio_operacion
        description: Año de inicio de operación (vacío si la fuente no lo informa).
      - name: latitud_aprox
        description: Latitud aproximada (geocodificada a mano desde la dirección; verificar antes de usar en un mapa).
      - name: longitud_aprox
        description: Longitud aproximada (ídem).
      - name: descripcion
        description: Para qué zona es representativa la estación.
      - name: orden
        description: Orden alfabético para gráficos.

  - name: dim_contaminante
    description: Una fila por contaminante, con unidades y factor de conversión a masa.
    columns:
      - name: id_contaminante
        description: Clave del contaminante ('no2', 'pm10', 'co', 'no', 'nox').
        data_tests: [unique, not_null]
      - name: codigo_fuente
        description: Nombre como figura en la fuente ('NO2', 'PM10').
      - name: nombre
        description: Nombre completo.
      - name: unidad_medicion
        description: Unidad en que se mide y publica (ppb, ppm o µg/m³).
      - name: unidad_masa
        description: Unidad de la guía OMS (µg/m³ o mg/m³).
      - name: peso_molecular
        description: Peso molecular en g/mol (vacío para PM10).
      - name: factor_masa
        description: "Multiplicador de unidad_medicion a unidad_masa: peso_molecular / 24,45 (25 °C, 1 atm)."
        data_tests: [not_null]
      - name: tolerancia_coherencia
        description: Tolerancia por redondeo para las reglas de coherencia (2 ppb o µg/m³; 0,2 ppm para CO).
      - name: maximo_fisico
        description: Máximo físicamente posible para un promedio urbano (regla fuera_de_rango).
      - name: tiene_guia_24h
        description: Verdadero si la OMS tiene guía de 24 h para el contaminante.
      - name: tiene_guia_anual
        description: Verdadero si la OMS tiene guía anual para el contaminante.
      - name: orden
        description: Orden para gráficos (NO2 primero).
      - name: descripcion
        description: Qué es, de dónde sale y por qué importa.

  - name: dim_calendario
    description: Un registro por día del período (2024-01-01 a 2026-09-30), haya o no datos.
    columns:
      - name: fecha
        description: Fecha (clave).
        data_tests: [unique, not_null]
      - name: anio
        description: Año.
      - name: mes
        description: Mes (1-12).
      - name: nombre_mes
        description: Nombre del mes en castellano.
      - name: anio_mes
        description: Primer día del mes (para ejes y agrupaciones mensuales).
      - name: estacion_del_anio
        description: Estación del año (hemisferio sur, meteorológica). Verano = dic, ene y feb.
        data_tests:
          - accepted_values:
              arguments:
                values: ["verano", "otoño", "invierno", "primavera"]
      - name: orden_estacion_del_anio
        description: 1 = verano … 4 = primavera (para ordenar en Power BI).
      - name: dia_semana
        description: Día de la semana ISO (1 = lunes … 7 = domingo).
      - name: nombre_dia
        description: Nombre del día en castellano.
      - name: tipo_dia
        description: Código del tipo de día. Un feriado tiene prioridad sobre sábado o domingo.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["habil", "sabado", "domingo", "feriado"]
      - name: tipo_dia_etiqueta
        description: Etiqueta legible del tipo de día (Hábil, Sábado, Domingo, Feriado).
      - name: orden_tipo_dia
        description: 1 = hábil, 2 = sábado, 3 = domingo, 4 = feriado.
      - name: es_feriado
        description: Verdadero si es feriado nacional o puente.
      - name: nombre_feriado
        description: Nombre del feriado (vacío si no es feriado; nulo estructural, no faltante).
      - name: tipo_feriado
        description: inamovible, trasladable o puente.
      - name: es_fin_de_semana
        description: Verdadero si es sábado o domingo.
      - name: es_anio_parcial
        description: Verdadero para los días del último año, que no está completo (2026).
      - name: es_dia_evento
        description: Verdadero si hubo un paro de transporte ese día.
      - name: evento
        description: Descripción del paro (vacío en el 99% de los días; nulo estructural).
      - name: grupo_evento
        description: sin_colectivos o trenes_subte.

  - name: dim_evento
    description: Días de paro de transporte (contexto para leer días atípicos).
    columns:
      - name: fecha
        description: Fecha del paro (clave; se relaciona con dim_calendario).
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_calendario')
                field: fecha
      - name: evento
        description: Descripción del paro.
      - name: grupo_evento
        description: sin_colectivos (paró la mayoría de las líneas) o trenes_subte (colectivos funcionando).
      - name: grupo_evento_etiqueta
        description: Etiqueta legible del grupo.
      - name: fuente_prensa
        description: Nota de prensa que documenta el paro.

  - name: dim_periodo
    description: >
      Períodos de los indicadores anuales: un año calendario por fila (el último, parcial) más
      'movil_12m', los últimos 12 meses con datos (comparable con un año completo).
    columns:
      - name: id_periodo
        description: "'2024', '2025', '2026' o 'movil_12m'."
        data_tests: [unique, not_null]
      - name: etiqueta
        description: Texto para mostrar.
      - name: tipo_periodo
        description: anio_completo, anio_parcial o movil_12m.
        data_tests:
          - accepted_values:
              arguments:
                values: ["anio_completo", "anio_parcial", "movil_12m"]
      - name: anio
        description: Año (vacío para movil_12m).
      - name: fecha_desde
        description: Primer día del período.
      - name: fecha_hasta
        description: Último día del período.
      - name: n_dias
        description: Cantidad de días del período.
      - name: orden
        description: Orden para gráficos.

  - name: ref_oms
    description: Guías OMS 2021 en formato ancho (una fila por contaminante × promedio). Se usa vía JOIN.
    columns:
      - name: id_contaminante
        description: Clave del contaminante.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_contaminante')
                field: id_contaminante
      - name: contaminante
        description: Nombre corto.
      - name: promedio
        description: "'24h' o 'anual'."
      - name: guia_oms
        description: Nivel guía (AQG).
      - name: it1
        description: Objetivo intermedio 1 (el menos exigente).
      - name: it2
        description: Objetivo intermedio 2.
      - name: it3
        description: Objetivo intermedio 3.
      - name: it4
        description: Objetivo intermedio 4.
      - name: unidad
        description: Unidad de la guía.

  - name: ref_oms_niveles
    description: Guías OMS en formato largo (UNPIVOT de ref_oms), una fila por nivel. Para líneas de referencia.
    columns:
      - name: id_contaminante
        description: Clave del contaminante.
      - name: contaminante
        description: Nombre corto.
      - name: promedio
        description: "'24h' o 'anual'."
      - name: nivel
        description: AQG, IT4, IT3, IT2 o IT1.
      - name: nivel_etiqueta
        description: Etiqueta legible del nivel.
      - name: orden_exigencia
        description: 1 = más exigente (guía) … 5 = menos exigente (IT1).
      - name: umbral
        description: Valor del umbral.
      - name: unidad
        description: Unidad del umbral.
    data_tests:
      - clave_unica:
          arguments:
            columnas: [id_contaminante, promedio, nivel]
