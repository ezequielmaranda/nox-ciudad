version: 2

models:
  - name: gold_sube_diario
    description: >
      Un registro por día: usos y proporción de un día típico por modo, y la "dosis" de paro de
      colectivos (porcentaje de líneas que circulan por CABA con menos del 15% de sus usos habituales).
    columns:
      - name: fecha
        data_tests: [unique, not_null]
      - name: ratio_colectivo_caba
        description: >
          Usos del universo CABA / usos habituales del mismo día de la semana (solo días hábiles,
          porque la base son días normales). Mide cuánto se apartó un día hábil de lo habitual.
      - name: actividad_colectivo_vs_habil
        description: >
          Usos de colectivos de CABA / un día hábil normal típico (±4 semanas). Comparable entre
          tipos de día (domingo ~0,4; paro ~0,1). Eje X del gráfico de actividad vs. NOx/CO.
      - name: pct_lineas_paradas_ponderado
        description: >
          Porcentaje de líneas paradas, ponderado por sus usos habituales. Es la dosis del evento.
          Nulo en sábados y domingos (no hay base de comparación).
