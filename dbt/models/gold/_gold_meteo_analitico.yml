version: 2

models:
  - name: gold_meteo_diario
    description: >
      Meteorología de cada día (valor de ciudad), solo del registro diario del SMN (Aeroparque y
      Observatorio Central). Viento, temperatura y humedad: promedio de las dos estaciones.
      Lluvia: máximo diario entre las dos; sin registro = sin lluvia (supuesto a declarar).
      Llega hasta el último día con datos del SMN.
    columns:
      - name: fecha
        data_tests: [unique, not_null]
      - name: viento_kmh
        description: Velocidad media diaria del viento (km/h), promedio de las dos estaciones.
        data_tests: [not_null]
      - name: temp_c
        description: Temperatura media diaria (°C), promedio de las dos estaciones.
        data_tests: [not_null]
      - name: hubo_lluvia
        description: Precipitación de 1 mm o más en alguna de las dos estaciones.

  - name: gold_analitico
    description: >
      Tabla del análisis: una fila por estación de monitoreo y día, con calidad del aire, actividad
      del transporte, dosis de paro, meteorología, tipo de día, marca de día normal y evento.
    columns:
      - name: estacion
        data_tests: [not_null]
      - name: fecha
        data_tests: [not_null]
      - name: es_dia_normal
        description: Hábil, no feriado y con actividad de transporte típica. Universo de la regresión.
