version: 2

# Capa GOLD: lo que se analiza. Modelo estrella (dimensiones + dos tablas de hechos), la tabla de
# guías OMS, los indicadores anuales y el resumen de calidad. Son las tablas que se exportan a
# data/final/ y que leen el notebook y Looker Studio (vía dashboard/looker/).
models:
  - name: dim_estacion
    description: Una fila por estación de monitoreo de la APrA.
    columns:
      - name: id_estacion
        description: Clave de la estación ('centenario', 'cordoba', 'la_boca').
        data_tests: [unique, not_null]
      - name: nombre
        description: Nombre legible para mostrar.
      - name: entorno
        description: Tipo de zona según la APrA (residencial-comercial, mixta).
      - name: flujo_vehicular
        description: Flujo vehicular de la zona según la APrA (alto, medio, medio-bajo).
      - name: fuentes_fijas
        description: Incidencia de fuentes fijas (industrias, puerto) según la APrA.
      - name: latitud
        description: Latitud de la estación (BA Data, estaciones-ambientales.csv).
      - name: longitud
        description: Longitud de la estación (BA Data, estaciones-ambientales.csv).
      - name: descripcion
        description: Para qué zona es representativa la estación.
      - name: orden
        description: Orden alfabético para gráficos.

  - name: dim_contaminante
    description: Una fila por contaminante, con unidades y factor de conversión a masa.
    columns:
      - name: id_contaminante
        description: Clave del contaminante ('no2', 'pm10', 'co').
        data_tests: [unique, not_null]
      - name: codigo_fuente
        description: Nombre como figura en la fuente ('NO2', 'PM10').
      - name: nombre
        description: Nombre completo.
      - name: unidad_medicion
        description: Unidad en que se mide y publica (ppb, ppm o µg/m³).
      - name: unidad_masa
        description: Unidad de la guía OMS (µg/m³ o mg/m³).
      - name: factor_masa
        description: "Multiplicador de unidad_medicion a unidad_masa: peso_molecular / 24,45 (25 °C, 1 atm)."
        data_tests: [not_null]
      - name: orden
        description: Orden para gráficos (NO2 primero).
      - name: descripcion
        description: Qué es, de dónde sale y por qué importa.

  - name: dim_calendario
    description: Un registro por día del período de estudio (2024-01-01 a 2026-09-30), haya o no datos.
    columns:
      - name: fecha
        description: Fecha (clave).
        data_tests: [unique, not_null]
      - name: anio
        description: Año.
      - name: mes
        description: Mes (1-12).
      - name: anio_mes
        description: Primer día del mes (para ejes y agrupaciones mensuales).
      - name: estacion_del_anio
        description: Estación del año (hemisferio sur, meteorológica). Verano = dic, ene y feb.
        data_tests:
          - accepted_values:
              arguments:
                values: ["verano", "otoño", "invierno", "primavera"]
      - name: orden_estacion_del_anio
        description: 1 = verano … 4 = primavera (para ordenar en los gráficos).
      - name: dia_semana
        description: Día de la semana ISO (1 = lunes … 7 = domingo).
      - name: nombre_dia
        description: Nombre del día en castellano.
      - name: tipo_dia
        description: Código del tipo de día. Un feriado tiene prioridad sobre sábado o domingo.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["habil", "sabado", "domingo", "feriado"]
      - name: tipo_dia_etiqueta
        description: Etiqueta legible del tipo de día (Hábil, Sábado, Domingo, Feriado).
      - name: orden_tipo_dia
        description: 1 = hábil, 2 = sábado, 3 = domingo, 4 = feriado.

  - name: guia_oms
    description: >
      Guías de la OMS 2021 en formato largo: una fila por contaminante × período de promedio (24h o
      anual) × nivel (guía AQG y objetivos intermedios IT4 a IT1). Sale de data/reference/oms_2021.csv.
    columns:
      - name: id_contaminante
        description: Contaminante (clave hacia dim_contaminante).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_contaminante')
                field: id_contaminante
      - name: promedio
        description: Período de promedio de la guía ('24h' o 'anual').
        data_tests:
          - accepted_values:
              arguments:
                values: ["24h", "anual"]
      - name: nivel
        description: AQG (guía), IT4, IT3, IT2 o IT1.
      - name: orden_exigencia
        description: 1 = guía (más exigente) … 5 = IT1 (menos exigente). Para ordenar.
      - name: umbral
        description: Valor del nivel (µg/m³; mg/m³ para el CO).
        data_tests: [not_null]
      - name: unidad
        description: Unidad del umbral.
    data_tests:
      - clave_unica:
          arguments:
            columnas: [id_contaminante, promedio, nivel]

  - name: fact_medicion_diaria
    description: >
      Tabla de hechos en formato largo. Grano: fecha × estación × contaminante, con el promedio de
      24 h comparado con la guía OMS de 24 h. Grilla completa del período de estudio: incluye los
      días sin dato, marcados con tiene_dato = falso y el motivo en motivo_sin_dato.
    columns:
      - name: fecha
        description: Fecha (clave hacia dim_calendario).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_calendario')
                field: fecha
      - name: id_estacion
        description: Estación (clave hacia dim_estacion).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_estacion')
                field: id_estacion
      - name: id_contaminante
        description: Contaminante (clave hacia dim_contaminante).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_contaminante')
                field: id_contaminante
      - name: n_horas_validas
        description: Horas con valor válido ese día (0 a 24). Para el NO2 hacen falta 18 para el promedio diario.
        data_tests:
          - entre:
              arguments:
                minimo: 0
                maximo: 24
      - name: tiene_dato
        description: Verdadero si hay promedio de 24 h válido.
        data_tests: [not_null]
      - name: motivo_sin_dato
        description: "Por qué no hay dato (vacío si tiene_dato): 'sin_fila', 'sin_dato_fuente' o 'incompleto'."
        data_tests:
          - accepted_values:
              arguments:
                values: ["sin_fila", "sin_dato_fuente", "incompleto"]
      - name: valor
        description: Promedio de 24 h en la unidad original, la de dim_contaminante.unidad_medicion (solo si tiene_dato).
        data_tests:
          - entre:
              arguments:
                minimo: 0
                maximo: 1000
      - name: valor_masa
        description: Promedio de 24 h en la unidad de la guía OMS, la de dim_contaminante.unidad_masa (µg/m³; mg/m³ para CO). Solo si tiene_dato.
        data_tests:
          - entre:
              arguments:
                minimo: 0
                maximo: 2000
      - name: supera_guia
        description: Verdadero si valor_masa supera la guía de 24 h (vacío si no hay dato).
      - name: nivel_oms
        description: "Escalón OMS de 24 h del día: AQG (cumple la guía), IT4 … IT1 o '> IT1'. Vacío si no hay dato."
        data_tests:
          - accepted_values:
              arguments:
                values: ["AQG", "IT4", "IT3", "IT2", "IT1", "> IT1"]
      - name: orden_nivel_oms
        description: 1 = cumple la guía … 6 = no cumple ni el IT1 (para ordenar).
      - name: es_outlier
        description: Verdadero si valor > Q3 + 3·IQR de su estación × contaminante. Se marca, no se borra.
        data_tests: [not_null]
    data_tests:
      - clave_unica:
          arguments:
            columnas: [fecha, id_estacion, id_contaminante]

  - name: fact_medicion_horaria
    description: >
      Valores horarios de NO2 del período de estudio (el único contaminante publicado como promedio
      de cada hora). Grano: fecha × hora × estación. Comparte dimensiones con la fact diaria; sirve
      para el perfil horario por tipo de día.
    columns:
      - name: fecha
        description: Fecha (clave hacia dim_calendario).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_calendario')
                field: fecha
      - name: hora
        description: Hora que termina (1 a 24; la 8 es de 07:00 a 08:00).
        data_tests:
          - not_null
          - entre:
              arguments:
                minimo: 1
                maximo: 24
      - name: id_estacion
        description: Estación (clave hacia dim_estacion).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_estacion')
                field: id_estacion
      - name: id_contaminante
        description: Siempre 'no2' (clave hacia dim_contaminante).
        data_tests:
          - accepted_values:
              arguments:
                values: ["no2"]
      - name: es_valido
        description: Verdadero si el valor horario pasa las reglas de calidad.
      - name: valor
        description: NO2 horario en ppb (solo si es válido).
      - name: valor_masa
        description: NO2 horario en µg/m³ (solo si es válido).
    data_tests:
      - clave_unica:
          arguments:
            columnas: [fecha, hora, id_estacion]

  - name: agg_anual
    description: >
      Indicadores anuales por estación × contaminante × período: años 2010 a 2026 (2026 parcial) y
      últimos 12 meses. Los del estudio (2024, 2025, 2026 y últimos 12 meses) tienen
      es_periodo_estudio = verdadero; 2010-2023 son contexto. Regla del 75%: si el período tiene
      menos de 75% de días con dato, los indicadores quedan vacíos (solo promedio_referencial).
    columns:
      - name: id_estacion
        description: Estación.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_estacion')
                field: id_estacion
      - name: id_contaminante
        description: Contaminante.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_contaminante')
                field: id_contaminante
      - name: id_periodo
        description: "Código del período: el año ('2024') o 'movil_12m'."
        data_tests: [not_null]
      - name: periodo
        description: Etiqueta legible del período.
      - name: tipo_periodo
        description: anio_completo, anio_parcial o movil_12m.
        data_tests:
          - accepted_values:
              arguments:
                values: ["anio_completo", "anio_parcial", "movil_12m"]
      - name: anio
        description: Año (vacío para los últimos 12 meses).
      - name: orden_periodo
        description: Para ordenar los períodos (los últimos 12 meses van al final).
      - name: es_periodo_estudio
        description: Verdadero para 2024, 2025, 2026 y los últimos 12 meses; falso para el contexto 2010-2023.
      - name: n_dias_periodo
        description: Días del período.
      - name: n_dias_con_dato
        description: Días con promedio de 24 h válido.
      - name: completitud
        description: n_dias_con_dato / n_dias_periodo (0 a 1).
        data_tests:
          - entre:
              arguments:
                minimo: 0
                maximo: 1
      - name: es_valido
        description: Verdadero si el período tiene >= 75% de días con dato.
        data_tests: [not_null]
      - name: promedio_anual
        description: Promedio de los valores diarios. Vacío si el período no es válido.
      - name: promedio_referencial
        description: El mismo promedio aunque el período no sea válido (solo para transparencia).
      - name: guia_anual
        description: Guía anual de la OMS (vacía para el CO).
      - name: veces_guia_anual
        description: promedio_anual / guia_anual.
      - name: nivel_oms
        description: Escalón OMS del promedio anual (AQG, IT4 … IT1, '> IT1').
      - name: orden_nivel_oms
        description: 1 = cumple la guía … 6 = no cumple ni el IT1 (para ordenar).
      - name: proximo_nivel
        description: Próximo escalón a alcanzar.
      - name: ug_para_proximo_nivel
        description: Cuánto tendría que bajar el promedio para subir un escalón.
      - name: p99_24h
        description: Percentil 99 de los valores diarios (definición formal de la guía de 24 h). Vacío si no es válido.
      - name: p99_veces_guia_24h
        description: p99_24h / guía OMS de 24 h (más de 1 = no se cumple la guía en sentido formal).
      - name: pct_dias_supera_24h
        description: n_dias_supera_24h / n_dias_con_dato (0 a 1).
        data_tests:
          - entre:
              arguments:
                minimo: 0
                maximo: 1
      - name: pct_cumple_guia_24h
        description: "% de días que cumplen la guía de 24 h (0 a 1). Vacío si el período no es válido."
        data_tests:
          - entre:
              arguments:
                minimo: 0
                maximo: 1
      - name: pct_cumple_it4_24h
        description: "% de días que cumplen el IT4 de 24 h o algo más exigente. Vacío si el nivel no existe."
        data_tests:
          - entre:
              arguments:
                minimo: 0
                maximo: 1
      - name: pct_cumple_it3_24h
        description: Ídem IT3.
        data_tests:
          - entre:
              arguments:
                minimo: 0
                maximo: 1
      - name: pct_cumple_it2_24h
        description: Ídem IT2.
        data_tests:
          - entre:
              arguments:
                minimo: 0
                maximo: 1
      - name: pct_cumple_it1_24h
        description: Ídem IT1.
        data_tests:
          - entre:
              arguments:
                minimo: 0
                maximo: 1
      - name: racha_maxima_dias
        description: Racha más larga de días con dato seguidos sobre la guía de 24 h en el período (huecos de hasta 7 días sin dato no la cortan).
      - name: racha_desde
        description: Primer día de esa racha.
      - name: racha_hasta
        description: Último día de esa racha.
    data_tests:
      - clave_unica:
          arguments:
            columnas: [id_estacion, id_contaminante, id_periodo]

  - name: calidad_resumen
    description: >
      Qué pasó con cada valor horario del período de estudio, por contaminante: válido o el motivo
      por el que se descartó, con en cuántos días y entre qué fechas aparece.
    columns:
      - name: id_contaminante
        description: Contaminante.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_contaminante')
                field: id_contaminante
      - name: categoria
        description: valido o el motivo por el que se descartó (silver.medicion_horaria.motivo_invalido).
      - name: n_valores
        description: Cantidad de valores horarios (celdas del CSV).
      - name: proporcion
        description: Proporción dentro del contaminante (0 a 1).
        data_tests:
          - entre:
              arguments:
                minimo: 0
                maximo: 1
      - name: n_dias
        description: Días en los que aparece la categoría.
      - name: primera_fecha
        description: Primer día en que aparece.
      - name: ultima_fecha
        description: Último día en que aparece.
    data_tests:
      - clave_unica:
          arguments:
            columnas: [id_contaminante, categoria]
