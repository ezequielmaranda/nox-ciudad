version: 2

models:
  - name: gold_aire_diario
    description: >
      Tabla analítica de calidad del aire: una fila por estación y día. Ventana diurna = bloque de
      8 a 16 h. Incluye el cociente NOx/CO (firma diésel) y los promedios de 24 h para comparar con
      las guías OMS. Solo usa valores válidos y dentro de rango.
    columns:
      - name: estacion
        data_tests: [not_null]
      - name: fecha
        data_tests: [not_null]
      - name: nox_co_816
        description: NOx (ppb) / CO (ppm) del bloque de 8 a 16 h.
      - name: no2_24h_ugm3
        description: NO2 de 24 h en µg/m³ (guía OMS 24 h = 25 µg/m³).
      - name: pm10_24h_ugm3
        description: PM10 de 24 h en µg/m³ (guía OMS 24 h = 45 µg/m³).
