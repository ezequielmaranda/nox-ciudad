version: 2

models:
  - name: agg_completitud_mensual
    description: Completitud del promedio de 24 h por estación × contaminante × mes (heatmap de calidad).
    columns:
      - name: id_estacion
        description: Estación.
      - name: id_contaminante
        description: Contaminante.
      - name: anio
        description: Año.
      - name: mes
        description: Mes (1-12).
      - name: anio_mes
        description: Primer día del mes.
      - name: n_dias_calendario
        description: Días del mes dentro del período.
      - name: n_dias_con_fila
        description: Días con al menos una hora en la fuente.
      - name: n_dias_con_dato
        description: Días con valor válido.
      - name: n_dias_sin_fila
        description: Días sin ninguna hora en la fuente.
      - name: n_dias_sin_dato_fuente
        description: Días con todas las horas en 's/d'.
      - name: n_dias_incompletos
        description: Días con horas pero sin las suficientes para el promedio de 24 h (o descartadas por una regla).
      - name: completitud
        description: n_dias_con_dato / n_dias_calendario (0 a 1).
        data_tests:
          - entre:
              arguments:
                minimo: 0
                maximo: 1
      - name: cumple_umbral
        description: Verdadero si la completitud del mes es >= 75%.
    data_tests:
      - clave_unica:
          arguments:
            columnas: [id_estacion, id_contaminante, anio_mes]

  - name: agg_completitud_anual
    description: Completitud por estación × contaminante × período y regla del 75% (es_valido).
    columns:
      - name: id_estacion
        description: Estación.
      - name: id_contaminante
        description: Contaminante.
      - name: id_periodo
        description: Período (clave hacia dim_periodo).
      - name: n_dias_periodo
        description: Días del período.
      - name: n_dias_con_dato
        description: Días con valor válido de 24 h.
      - name: completitud
        description: n_dias_con_dato / n_dias_periodo.
      - name: es_valido
        description: Verdadero si completitud >= 75% (los indicadores anuales se pueden calcular).
      - name: completitud_peor_trimestre
        description: Completitud del trimestre calendario con menos datos dentro del período.
      - name: cumple_criterio_trimestral
        description: >
          Verdadero si todos los trimestres del período tienen >= 75% de días con dato (criterio de la EPA
          para la norma de 1 hora). Es una advertencia: no excluye el indicador.
    data_tests:
      - clave_unica:
          arguments:
            columnas: [id_estacion, id_contaminante, id_periodo]

  - name: calidad_resumen
    description: Cantidad de valores horarios del período de estudio por contaminante y categoría de calidad.
    columns:
      - name: id_contaminante
        description: Contaminante.
      - name: categoria
        description: valido, valido_imputado o el motivo por el que se descartó.
      - name: n_valores
        description: Cantidad de valores horarios (celdas del CSV).
      - name: proporcion
        description: Proporción dentro del contaminante (0 a 1).

  - name: calidad_violaciones
    description: >
      Una fila por cada valor horario del período de estudio que viola una regla de validación
      (un valor puede violar varias). Todos quedan fuera del análisis.
    columns:
      - name: fecha
        description: Fecha.
      - name: hora
        description: Hora que termina (1 a 24; puede venir fuera de rango si la regla es hora_invalida).
      - name: id_estacion
        description: Estación.
      - name: id_contaminante
        description: Contaminante.
      - name: valor_crudo
        description: Texto original de la celda.
      - name: regla
        description: Regla violada (hora_invalida, texto_invalido, fuera_de_rango, fila_en_cero, valor_trabado).
        data_tests:
          - accepted_values:
              arguments:
                values: ["hora_invalida", "texto_invalido", "fuera_de_rango", "fila_en_cero", "valor_trabado"]
      - name: motivo_invalido
        description: Motivo principal por el que se descartó el valor.

  - name: calidad_outliers
    description: Valores diarios atípicos (Q3 + 3·IQR) con contexto para la revisión manual. No se borran.
    columns:
      - name: fecha
        description: Fecha.
      - name: id_estacion
        description: Estación.
      - name: id_contaminante
        description: Contaminante.
      - name: valor
        description: Promedio de 24 h en unidad original.
      - name: unidad
        description: Unidad original.
      - name: umbral_outlier
        description: Umbral Q3 + 3·IQR.
      - name: mediana
        description: Mediana de la serie (estación × contaminante).
      - name: veces_mediana
        description: valor / mediana.
      - name: nombre_dia
        description: Día de la semana.
      - name: tipo_dia
        description: Tipo de día.
      - name: evento
        description: Paro de transporte, si hubo.
