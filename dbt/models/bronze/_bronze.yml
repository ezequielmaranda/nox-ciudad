version: 2

models:
  - name: calidad_aire
    description: >
      El CSV horario de BA Data (data/raw/calidad-aire.csv) tal como llega: una fila por fecha y
      hora, una columna por estación × contaminante, todo como texto. No se corrige nada.

# Capa BRONZE: la fuente tal como llega. El CSV de BA Data (modelo calidad_aire) y las tablas de
# referencia mantenidas a mano en data/reference/ (seeds de dbt).
seeds:
  - name: oms_2021
    description: >
      Guías de calidad del aire de la OMS 2021 y objetivos intermedios (IT1 a IT4).
      Fuente: WHO global air quality guidelines (2021), resumen ejecutivo, Tabla 0.1
      "Recommended AQG levels and interim targets". Valores vacíos = la OMS no define ese nivel.
    config:
      column_types:
        id_contaminante: varchar
        promedio: varchar
        guia_oms: double
        it1: double
        it2: double
        it3: double
        it4: double
        unidad: varchar
    columns:
      - name: id_contaminante
        description: Código del contaminante (clave hacia dim_contaminante).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('contaminantes')
                field: id_contaminante
      - name: promedio
        description: Período de promedio de la guía ('24h' o 'anual').
        data_tests:
          - accepted_values:
              arguments:
                values: ["24h", "anual"]
      - name: guia_oms
        description: Nivel guía (AQG), el más exigente.
        data_tests: [not_null]
      - name: it1
        description: Objetivo intermedio 1 (el menos exigente).
      - name: it2
        description: Objetivo intermedio 2.
      - name: it3
        description: Objetivo intermedio 3.
      - name: it4
        description: Objetivo intermedio 4 (el más exigente antes de la guía).
      - name: unidad
        description: Unidad de la guía (µg/m³ o mg/m³).
    data_tests:
      - clave_unica:
          arguments:
            columnas: [id_contaminante, promedio]

  - name: contaminantes
    description: >
      Contaminantes medidos: unidades, peso molecular, cómo los publica la red (promedio horario o
      móvil, según contaminantes.csv de BA Data) y máximo plausible para la regla fuera_de_rango.
    config:
      column_types:
        peso_molecular: double
        maximo_plausible: double
        orden: integer
    columns:
      - name: id_contaminante
        data_tests: [unique, not_null]

  - name: estaciones
    description: >
      Estaciones de monitoreo de la APrA: entorno, flujo vehicular y fuentes fijas de las páginas
      de cada estación, y coordenadas del archivo estaciones-ambientales.csv de BA Data.
    config:
      column_types:
        latitud: double
        longitud: double
    columns:
      - name: id_estacion
        data_tests: [unique, not_null]

  - name: feriados
    description: >
      Feriados nacionales 2024-2026, incluidos los puentes turísticos.
      Fuente: API pública ArgentinaDatos (https://api.argentinadatos.com/v1/feriados/<año>).
    config:
      column_types:
        fecha: date
        nombre: varchar
    columns:
      - name: fecha
        data_tests: [unique, not_null]
