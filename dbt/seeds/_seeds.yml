version: 2

seeds:
  - name: eventos
    description: >
      Los días de paro de transporte público de 2024-2026 confirmados en los datos de SUBE, en dos grupos:
      sin_colectivos (paró más de la mitad de las líneas de colectivo) y trenes_subte (pararon trenes y/o subte
      con los colectivos funcionando). Incluye el % de líneas de colectivo que circulan por CABA que pararon.
    config:
      column_types:
        fecha: date
        evento: varchar
        grupo: varchar
        pct_lineas_paradas_caba: integer
        fuente_prensa: varchar
    columns:
      - name: fecha
        data_tests: [unique, not_null]
      - name: grupo
        data_tests:
          - accepted_values:
              arguments:
                values: ["sin_colectivos", "trenes_subte"]

  - name: feriados
    description: >
      Feriados nacionales 2024-2026, incluidos los puentes turísticos.
      Fuente: API pública ArgentinaDatos (https://api.argentinadatos.com/v1/feriados/<año>).
      No incluye días no laborables optativos (p. ej. Jueves Santo): esos días los detecta SUBE.
    config:
      column_types:
        fecha: date
        tipo: varchar
        nombre: varchar
    columns:
      - name: fecha
        data_tests: [unique, not_null]
      - name: tipo
        data_tests:
          - accepted_values:
              arguments:
                values: ["inamovible", "trasladable", "puente"]
