name: nox_ciudad
version: "1.0.0"
profile: nox_ciudad

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

# Arquitectura medallón: un schema por capa dentro de data/nox.duckdb.
models:
  nox_ciudad:
    bronze:
      +schema: bronze
      +materialized: table
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table

# Tablas chicas mantenidas a mano (eventos, feriados): van con bronze porque son insumos.
seeds:
  nox_ciudad:
    +schema: bronze
